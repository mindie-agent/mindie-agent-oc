[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-agent-oc"
version = "0.1.7"
description = "OpenCode native harness plugin adapter for MindIE Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mindie-knowledge>=0.13.0",
    "remote-dev>=0.11.0",
    "mindie-diagnostics>=0.5.0",
    "mindie-coordinator>=0.7.0",
    "mindie-debugger>=0.1.0",
    "mindie-profiler>=0.5.0",
    "mindie-sim>=0.9.0",
    "npu-top>=0.3.0",
]

[project.optional-dependencies]
components = []
test = [
    "pytest>=8,<10",
    "jsonschema>=4",
]

[tool.setuptools]
py-modules = []

[tool.uv.sources]
mindie-knowledge = { git = "https://github.com/mindie-agent/knowledge", rev = "c991b64a1ead277b5ce91b7835337b01aed03998" }
remote-dev = { git = "https://github.com/mindie-agent/remote-dev", rev = "c4d38f99c1ef5aace1c088af07647941adc2d394" }
mindie-diagnostics = { git = "https://github.com/mindie-agent/diagnostics", rev = "cd16baa406070bcd41bbe39a9e488cc8753c60c5" }
mindie-coordinator = { git = "https://github.com/mindie-agent/coordinator", rev = "33e2c6966d21d62969a2148145e74885dc826e3c" }
mindie-debugger = { git = "https://github.com/mindie-agent/debugger", rev = "33052a2fc10c7475e4b819577870ca822efcebd0" }
mindie-profiler = { git = "https://github.com/mindie-agent/profiler", rev = "889b6ef161862938cc07b1b4123c57e302965d48" }
mindie-sim = { git = "https://github.com/mindie-agent/sim", rev = "9dbab02f10843c7b829d6fda7e7b9ad89e4f92e5" }
npu-top = { git = "https://github.com/mindie-agent/npu-top", rev = "4341003c6637e2b8b9512c7b076f80f45019e252" }

[tool.uv]
override-dependencies = [
    "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@c991b64a1ead277b5ce91b7835337b01aed03998",
    "remote-dev @ git+https://github.com/mindie-agent/remote-dev@c4d38f99c1ef5aace1c088af07647941adc2d394",
    "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@cd16baa406070bcd41bbe39a9e488cc8753c60c5",
    "mindie-coordinator @ git+https://github.com/mindie-agent/coordinator@33e2c6966d21d62969a2148145e74885dc826e3c",
    "mindie-debugger @ git+https://github.com/mindie-agent/debugger@33052a2fc10c7475e4b819577870ca822efcebd0",
    "mindie-profiler @ git+https://github.com/mindie-agent/profiler@889b6ef161862938cc07b1b4123c57e302965d48",
    "mindie-sim @ git+https://github.com/mindie-agent/sim@9dbab02f10843c7b829d6fda7e7b9ad89e4f92e5",
    "npu-top @ git+https://github.com/mindie-agent/npu-top@4341003c6637e2b8b9512c7b076f80f45019e252",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_npu: standing A2/A3 Ascend NPU non-destructive live integration",
    "live_opencode: live OpenCode v2 CLI and model end-to-end integration",
]
