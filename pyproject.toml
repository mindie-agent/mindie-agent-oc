[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-agent-oc"
version = "0.1.2"
description = "OpenCode native harness plugin adapter for MindIE Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mindie-knowledge>=0.13.0",
    "remote-dev>=0.11.0",
    "mindie-diagnostics>=0.5.0",
    "mindie-coordinator>=0.7.0",
    "mindie-debugger>=0.1.0",
    "mindie-profiler>=0.5.0",
    "mindie-sim>=0.9.0",
    "npu-top>=0.3.0",
]

[project.optional-dependencies]
components = []
test = [
    "pytest>=8,<10",
    "jsonschema>=4",
]

[tool.setuptools]
py-modules = []

[tool.uv.sources]
mindie-knowledge = { git = "https://github.com/mindie-agent/knowledge", rev = "99d65f11d904bb945d33cf3a9e006609702d8dda" }
remote-dev = { git = "https://github.com/mindie-agent/remote-dev", rev = "6e9882e0fa495bf2feeef29ec86492498d364531" }
mindie-diagnostics = { git = "https://github.com/mindie-agent/diagnostics", rev = "37ed7f04a47eae8097cc286335186c3fcd9584b3" }
mindie-coordinator = { git = "https://github.com/mindie-agent/coordinator", rev = "db9b0c6432001d6049056eabd37422d0bfb9f75a" }
mindie-debugger = { git = "https://github.com/mindie-agent/debugger", rev = "28c558bc545680cdbad60771d1eeb902955ddd3f" }
mindie-profiler = { git = "https://github.com/mindie-agent/profiler", rev = "f7dbca5e643db52807e12649e02291069f3d9d82" }
mindie-sim = { git = "https://github.com/mindie-agent/sim", rev = "f0b19acdab6f5f4e952561c7ff92e4bf9c0b0c3a" }
npu-top = { git = "https://github.com/mindie-agent/npu-top", rev = "8a68947e730b21b5ed65c50c34aec0e923b3a14c" }

[tool.uv]
override-dependencies = [
    "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@99d65f11d904bb945d33cf3a9e006609702d8dda",
    "remote-dev @ git+https://github.com/mindie-agent/remote-dev@6e9882e0fa495bf2feeef29ec86492498d364531",
    "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@37ed7f04a47eae8097cc286335186c3fcd9584b3",
    "mindie-coordinator @ git+https://github.com/mindie-agent/coordinator@db9b0c6432001d6049056eabd37422d0bfb9f75a",
    "mindie-debugger @ git+https://github.com/mindie-agent/debugger@28c558bc545680cdbad60771d1eeb902955ddd3f",
    "mindie-profiler @ git+https://github.com/mindie-agent/profiler@f7dbca5e643db52807e12649e02291069f3d9d82",
    "mindie-sim @ git+https://github.com/mindie-agent/sim@f0b19acdab6f5f4e952561c7ff92e4bf9c0b0c3a",
    "npu-top @ git+https://github.com/mindie-agent/npu-top@8a68947e730b21b5ed65c50c34aec0e923b3a14c",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_npu: standing A2/A3 Ascend NPU non-destructive live integration",
    "live_opencode: live OpenCode v2 CLI and model end-to-end integration",
]
